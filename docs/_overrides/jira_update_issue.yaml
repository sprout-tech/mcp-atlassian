examples:
  - |
    {"issue_key": "PROJ-123", "attachments": "[\"uploads/screenshot.png\"]", "return_fields": "key,summary"}
  - |
    {"issue_key": "PROJ-123", "attachments": "[{\"filename\":\"tiny.png\",\"mime_type\":\"image/png\",\"base64\":\"iVBORw0KGgo=\"}]", "return_fields": "key,summary"}
  - |
    {"issue_key": "PROJ-123", "fields": "{\"summary\": \"Updated title\", \"description\": \"New description\"}", "transition": "Done", "comment": "Completed the work", "worklog": "1h"}
tips: |
  **Attach a screenshot / chat image:** use this tool (there is no `jira_upload_attachment`). Preferred: save the file under the MCP server workspace (e.g. `uploads/screenshot.png`) and pass a relative path — `attachments: ["uploads/screenshot.png"]`. Do **not** base64-encode large images into the tool argument (inline base64 is soft-capped ~64 KiB); LLMs cannot reliably pass 100k+ character args.

  Tiny files only may use inline `{filename, base64, mime_type}` objects.

  Save response tokens: after an update you rarely need the whole issue back. Set `return_fields` to only the field(s) you changed (e.g., `return_fields: "duedate"`) — this can cut thousands of tokens. Use `*all` only when you need the full updated issue.

  `fields` is optional when you only need to attach files, transition, comment, or log work. If `transition` and `comment` are both provided, the issue is transitioned first and the comment is added separately afterward. Use `comment_visibility` to restrict the comment's visibility.

  Use `additional_fields` as a JSON string for any field not covered by explicit parameters. Find field IDs with `jira_search_fields`.

  Absolute paths outside the MCP server CWD are rejected (`validate_safe_path`).
