example: |
  {"issue_key": "PROJ-123"}
tips: |
  Downloads all attachments from the issue. Files larger than 50MB are skipped. Returns base64-encoded content.

  To **upload / attach** a screenshot to an existing issue, use `jira_update_issue` with a workspace-relative path in `attachments` (e.g. `["uploads/shot.png"]`). Inline base64 is only for tiny files; large base64 tool args are rejected.
