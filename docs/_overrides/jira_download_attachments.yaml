  {"issue_key": "PROJ-123"}
tips: |
  Downloads all attachments from the issue. Files larger than 50MB are skipped. Returns base64-encoded content.

  To **upload / attach** to an existing issue, use `jira_update_issue`. If the agent cannot write into the MCP server CWD (Claude Desktop), pass inline base64. If it shares the MCP filesystem, prefer a relative path like `["uploads/shot.png"]`.
