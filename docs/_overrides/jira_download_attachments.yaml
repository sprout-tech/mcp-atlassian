example: |
  {"issue_key": "PROJ-123"}
tips: |
  Downloads all attachments from the issue. Files larger than 50MB are skipped. Returns base64-encoded content.

  To **upload** attachments (including chat-pasted images), use `jira_update_issue` with the `attachments` parameter — either workspace-relative paths or inline `{filename, base64, mime_type}` objects.
